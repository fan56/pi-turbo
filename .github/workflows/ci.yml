# CI: install + every script gate the package declares (typecheck / check /
# test / smoke, each --if-present) + an `npm pack --dry-run` that fails when
# the published tarball would miss an entry file. Runs on every push to main,
# every pull request, and a daily schedule — the daily run catches upstream
# pi drift (the devDependency closure moves under us) without hand-pinning.
#
# No dsh CLI here: these are pi-coding-agent extensions. The host closure is
# the npm-installed @earendil-works/* devDependencies, resolved fresh on
# every run.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily 04:20 UTC — catches upstream pi drift without hand-pinning.
    - cron: '20 4 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # The shipped engines floor plus current LTS.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        # Repos with a lockfile get the reproducible install; the rest
        # resolve the @earendil-works/* devDependency closure fresh.
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Check
        run: npm run check --if-present

      - name: Test
        run: npm run test --if-present

      - name: Smoke (jiti loads the extension entry)
        run: npm run smoke --if-present

      - name: Version sentinel (schedule only)
        # On the daily run only: warn (never fail) when a locked
        # @earendil-works/* direct dep is behind the latest published version.
        if: github.event_name == 'schedule'
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const direct = { ...(pkg.dependencies || {}), ...(pkg.peerDependencies || {}), ...(pkg.devDependencies || {}) };
            for (const name of Object.keys(direct)) {
              if (!name.startsWith("@earendil-works/")) continue;
              const entry = lock.packages["node_modules/" + name];
              console.log(name + " " + (entry ? entry.version : "unknown"));
            }
          ' | while read -r name locked; do
            latest=$(npm view "$name" version --registry=https://registry.npmjs.org 2>/dev/null) || {
              echo "::warning::$name version check skipped (npm view failed)"
              continue
            }
            if [ -n "$latest" ] && [ "$latest" != "$locked" ]; then
              echo "::warning::$name $latest available (locked: $locked)"
            fi
          done

      - name: Pack dry-run (files must cover the entry points)
        run: npm pack --dry-run
